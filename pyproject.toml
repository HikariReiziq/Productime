[project]
name = "productime"
version = "1.1.0"
description = "Lightweight native Fedora Linux focus timer, alarm, stopwatch, and productivity report."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
# Runtime uses only Fedora system libraries (python3-gobject, gtk4, libadwaita, gstreamer1, python3-cairo).
dependencies = []

[project.gui-scripts]
productime = "productime.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
productime = ["ui/styles/*.css", "ui/icons/**/*"]

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["src", "tests/unit", "tests/integration", "tests/ui"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
# gi.require_version() must run before gi.repository imports, so imports cannot all sit at the top.
ignore = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["productime", "support", "gtk_harness"]
# Test modules import _bootstrap first because it puts src/ and tests/ on sys.path.
section-order = ["future", "standard-library", "bootstrap", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
bootstrap = ["_bootstrap"]

[tool.ruff.lint.per-file-ignores]
# Tests launch the real app and system tools with fixed argument lists.
"tests/**/*.py" = ["S603", "S607", "S108", "S311"]
"scripts/*.py" = ["S603", "S607"]
